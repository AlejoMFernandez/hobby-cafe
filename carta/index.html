<!doctype html>
<!-- Carta pública: la página a la que lleva el QR de las mesas. Va en web/carta/index.html de cada demo (scripts/instalar.mjs la copia).
     Se edita desde /admin (Carta) y el QR + las tarjetas para imprimir salen de /admin (QR de la carta). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Carta · Hobby</title>
<meta name="description" content="Carta online, siempre actualizada.">
<script>
  // /carta sin barra final rompe las rutas relativas en algunos servidores (XAMPP): la agregamos.
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../kit/kit.css?v=1">
<link rel="stylesheet" href="../kit/menu.css?v=1">
<link rel="stylesheet" href="../css/fonts.css?v=1">
<style>
  /* Hobby: la carta del QR con la identidad de la web */
  body { background: #F2EDEB; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: url(../img/grano.webp) 0 0 / 360px repeat; opacity: .14; }
  .kit-menu { --kit-font-head: 'Bricolage', 'Hanken', system-ui, sans-serif; --kit-font-body: 'Hanken', system-ui, sans-serif; position: relative; }
  .kmn-sec__t { font-family: 'Bricolage', system-ui, sans-serif !important; font-weight: 700 !important; letter-spacing: -.03em !important; text-transform: lowercase; }
  .kmn-item__n { font-family: 'Bricolage', system-ui, sans-serif !important; font-weight: 700 !important; }
  .kmn-chip { border-radius: 0 !important; border: 0 !important; background: #DEDBD2 !important; color: #443538 !important; font-family: 'Bricolage', system-ui, sans-serif !important; font-weight: 700 !important; clip-path: polygon(0 4%, 97% 0, 100% 94%, 3% 100%); }
  .kmn-chip[aria-current="true"], .kmn-chip.is-on, .kmn-chip[aria-selected="true"] { background: #443538 !important; color: #F2EDEB !important; }
  .kmn-item__foto { clip-path: polygon(3% 0, 100% 4%, 96% 100%, 0 95%); border-radius: 0 !important; }
  .kmn-sig { border-radius: 0 !important; }
  .kmn-pie { background: #443538 !important; }
</style>
</head>
<body>
<div id="kit-menu" class="kit-root kit-menu" aria-busy="true"></div>
<script type="module">
  import { initMenu } from '../kit/modules/menu.js?v=1';
  initMenu({ config: '../cliente.json', sitio: '../', imagenes: { lqip: '../img/lqip.json' } });
</script>
</body>
</html>
